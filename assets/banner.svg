<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 350"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="text-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="bar-grad" x1="0%" x2="0%" y1="100%" y2="0%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".2"/><stop offset="100%" stop-color="#a855f7" stop-opacity=".8"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes wave{0%{d:path(&quot;M 0 220 Q 300 160 600 220 T 1200 220 L 1200 350 L 0 350 Z&quot;)}50%{d:path(&quot;M 0 240 Q 300 280 600 200 T 1200 240 L 1200 350 L 0 350 Z&quot;)}}@keyframes pulse-node{0%{transform:scale(1);opacity:.6}50%{transform:scale(1.4);opacity:1}}@keyframes float-item{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:52px;fill:url(#text-grad)}.subtitle{font-weight:400;font-size:22px;fill:#cbd5e1}.badge-text{font-weight:600;font-size:14px;fill:#38bdf8}.animated-wave{animation:wave 12s ease-in-out infinite}.node{animation:pulse-node 3s ease-in-out infinite;transform-origin:center}.floating{animation:float-item 6s ease-in-out infinite}</style><rect width="1200" height="350" fill="url(#bg-grad)" rx="16"/><g opacity=".25"><line x1="100" x2="100" y1="50" y2="300" stroke="#94a3b8" stroke-dasharray="4 4" stroke-width="1"/><line x1="300" x2="300" y1="50" y2="300" stroke="#94a3b8" stroke-dasharray="4 4" stroke-