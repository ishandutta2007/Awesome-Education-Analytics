<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="bar-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 52px; fill: url(#text-grad); }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 22px; fill: #cbd5e1; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    
    /* Dynamic background animations */
    @keyframes wave {
      0% { d: path("M 0 220 Q 300 160 600 220 T 1200 220 L 1200 350 L 0 350 Z"); }
      50% { d: path("M 0 240 Q 300 280 600 200 T 1200 240 L 1200 350 L 0 350 Z"); }
      100% { d: path("M 0 220 Q 300 160 600 220 T 1200 220 L 1200 350 L 0 350 Z"); }
    }
    @keyframes pulse-node {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.4); opacity: 1; }
    }
    @keyframes float-item {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .animated-wave { animation: wave 12s ease-in-out infinite; }
    .node { animation: pulse-node 3s ease-in-out infinite; transform-origin: center; }
    .floating { animation: float-item 6s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bg-grad)" rx="16"/>

  <!-- Dynamic / Background Analytics Graphics (Behind Text) -->
  <g opacity="0.25">
    <!-- Grid Lines -->
    <line x1="100" y1="50" x2="100" y2="300" stroke="#94a3b8" stroke-dasharray="4 4" stroke-width="1"/>
    <line x1="300" y1="50" x2="300" y2="300" stroke="#94a3b8" stroke-dasharray="4 4" stroke-width="1"/>
    <line x1="500" y1="50" x2="500" y2="300" stroke="#94a3b8" stroke-dasharray="4 4" stroke-width="1"/>
    <line x1="700" y1="50" x2="700" y2="300" stroke="#94a3b8" stroke-dasharray="4 4" stroke-width="1"/>
    <line x1="900" y1="50" x2="900" y2="300" stroke="#94a3b8" stroke-dasharray="4 4" stroke-width="1"/>
    <line x1="1100" y1="50" x2="1100" y2="300" stroke="#94a3b8" stroke-dasharray="4 4" stroke-width="1"/>

    <!-- Chart Bars (Background) -->
    <rect x="850" y="120" width="35" height="180" rx="4" fill="url(#bar-grad)"/>
    <rect x="910" y="80" width="35" height="220" rx="4" fill="url(#bar-grad)"/>
    <rect x="970" y="150" width="35" height="150" rx="4" fill="url(#bar-grad)"/>
    <rect x="1030" y="60" width="35" height="240" rx="4" fill="url(#bar-grad)"/>
    <rect x="1090" y="100" width="35" height="200" rx="4" fill="url(#bar-grad)"/>
  </g>

  <!-- Animated Wave Background Curve -->
  <path class="animated-wave" fill="#818cf8" opacity="0.12" d="M 0 220 Q 300 160 600 220 T 1200 220 L 1200 350 L 0 350 Z" />

  <!-- Background Glowing Data Nodes -->
  <g opacity="0.4">
    <circle class="node" cx="200" cy="80" r="6" fill="#38bdf8" style="animation-delay: 0s;"/>
    <circle class="node" cx="500" cy="60" r="8" fill="#818cf8" style="animation-delay: 1s;"/>
    <circle class="node" cx="800" cy="90" r="5" fill="#c084fc" style="animation-delay: 2s;"/>
    <line x1="200" y1="80" x2="500" y2="60" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="500" y1="60" x2="800" y2="90" stroke="#818cf8" stroke-width="1" stroke-dasharray="3 3"/>
  </g>

  <!-- Foreground Content Container (Ensures readability above dynamic graphics) -->
  <g transform="translate(60, 0)">
    
    <!-- Top Pill Category Badge -->
    <g transform="translate(0, 55)">
      <rect width="240" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
      <text x="120" y="21" text-anchor="middle" class="badge-text">🎓 EDTECH &amp; ANALYTICS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" class="title" filter="url(#glow)">Awesome Education Analytics</text>

    <!-- Subtitle -->
    <text x="0" y="195" class="subtitle">Curated Insights, SaaS Platforms, &amp; Open-Source Learning Analytics Ecosystem</text>

    <!-- Stat/Feature Highlights Pill Cards -->
    <g transform="translate(0, 240)" class="floating">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="230" height="50" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="20" y="30" font-family="system-ui, sans-serif" font-size="20" fill="#38bdf8">📊 10+ SaaS Platforms</text>
      </g>
      <!-- Card 2 -->
      <g transform="translate(250, 0)">
        <rect width="240" height="50" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="20" y="30" font-family="system-ui, sans-serif" font-size="20" fill="#818cf8">🔓 Open-Source Tools</text>
      </g>
      <!-- Card 3 -->
      <g transform="translate(510, 0)">
        <rect width="250" height="50" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="20" y="30" font-family="system-ui, sans-serif" font-size="20" fill="#c084fc">📈 Institutional Research</text>
      </g>
    </g>

  </g>
</svg>
